# Simple workflow for testing build status
name: Test Build

on:
  # Runs on pushes targeting the any branch except main
  push:
    branches-ignore: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build job
  build:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
